version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck   # subsumes gosimple in golangci-lint v2
    - unused
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/thorlaidanegg/clob

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
